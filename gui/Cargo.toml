[package]
name = "bipolar-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bipolar-gui"
path = "src/main.rs"

[dependencies]
bevy = "0.19.0"
bipolar-orchestrator = { path = "../orchestrator" }
bipolar-shared = { path = "../shared" }
crossbeam-channel = "0.5"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
